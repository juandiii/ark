name: Test

on:
  workflow_call:

env:
  # Maven Central rate-limits GitHub runners (HTTP 429), worst when parallel jobs start
  # with a cold cache after a pom change. Retry 429/503 more and back off longer than
  # Maven's default (3 retries, 5 s).
  MAVEN_ARGS: -Daether.connector.http.retryHandler.count=10 -Daether.connector.http.retryHandler.interval=10000

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    name: Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and Test
        run: ./mvnw clean verify -Djava.version=${{ matrix.java }}
  vertx5:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    name: Vert.x 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build and Test against Vert.x 5
        run: ./mvnw clean verify -Pvertx5 -pl execution-models/ark-vertx,transports/ark-transport-vertx,transports/ark-transport-vertx-mutiny -am
